name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint:
    strategy:
      fail-fast: false
      matrix:
        # Full Python sweep on Linux; macOS and Windows only on the latest
        # supported version (no OS-specific code paths to justify a full sweep).
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs needs tags to derive the version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Setup
        run: scripts/setup.sh
      - name: Test
        run: scripts/test.sh
      - name: Lint
        run: scripts/lint.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build docker
        run: scripts/build_docker.sh
      - name: Test
        run: scripts/test_docker.sh
      - name: Lint
        run: scripts/lint_docker.sh

  deploy-test:
    needs: [test-lint, docker]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # required for TestPyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Deploy to TestPyPI
        run: scripts/deploy.sh --test
