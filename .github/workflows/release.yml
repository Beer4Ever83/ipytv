name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the tag to derive the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Package
        run: scripts/package.sh
      - name: Publish to PyPI
        run: scripts/publish.sh
